general {
    lock_cmd = pidof hyprlock || hyprlock
    # before_sleep_cmd = loginctl lock-session
    # before_sleep_cmd = hyprlock
    # after_sleep_cmd = sleep 0.1 && hyprctl dispatch dpms on && sleep 1 && hyprctl eval "hl.exec_scheduled_prop_refresh_immediately()"
    before_sleep_cmd = hyprlock # && hyprctl dispatch "hl.dsp.dpms({ action = "disable" })"
    # after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = "enable" })" 
    # after_sleep_cmd = hyprctl eval "hl.exec_scheduled_prop_refresh_immediately()"
    # after_sleep_cmd = sleep 0.7 && hyprctl dispatch "hl.dsp.cursor.move({x=0,y=0})"
    after_sleep_cmd = hyprctl dispatch "hl.dsp.force_renderer_reload()"
}

listener {
    timeout = 600         # seconds (5min)
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = "disable" })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = "enable" })"
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

